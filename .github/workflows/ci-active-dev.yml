name: CI Active Dev

'on':
  push:
    branches:
      - main
    paths:
      - backend/**
      - scripts/**
      - migrations/**
      - frontend/BigGulp/**
      - build_graph.py
      - requirements.txt
      - .env.example
      - .github/workflows/ci-active-dev.yml
      - .github/workflows/deploy-frontend.yml
      - .github/workflows/export-memory-artifacts.yml
  pull_request:
    paths:
      - backend/**
      - scripts/**
      - migrations/**
      - frontend/BigGulp/**
      - build_graph.py
      - requirements.txt
      - .env.example
      - .github/workflows/ci-active-dev.yml
      - .github/workflows/deploy-frontend.yml
      - .github/workflows/export-memory-artifacts.yml

jobs:
  backend-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile active Python surface
        run: python -m compileall backend scripts migrations build_graph.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/BigGulp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/BigGulp/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:8000
          VITE_API_KEY: ci-placeholder-key
        run: npm run build
